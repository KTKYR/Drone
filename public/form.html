<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Log Form</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/form.js" defer></script>
  <script src="/navbar.js" defer></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">Drone Dashboard</div>
    <div class="nav-links">
      <a href="/">Config</a>
      <a href="/form" class="active">Form</a>
      <a href="/logs-view">Logs</a>
    </div>
  </nav>

  <div class="card">
    <h2>Temperature Log Form</h2>

    <form id="temperature-form">
      <div class="form-group">
        <label for="celsius">Temperature in celsius:</label>
        <input 
          type="number" 
          id="celsius" 
          name="celsius" 
          step="any" 
          placeholder="ระบุอุณหภูมิ (องศาเซลเซียส)" 
          required
        >
      </div>

      <!-- แสดงสถานะแจ้งเตือนเมื่อยังไม่โหลด Config จาก Page #1 -->
      <div id="alert-box" class="alert" style="display: none;"></div>

      <button type="submit" id="submit-btn">Submit data</button>
    </form>
  </div>

</body>
</html>
