<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drone Config</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/config.js" defer></script>
  <script src="/navbar.js" defer></script>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">Drone Dashboard</div>
    <div class="nav-links">
      <a href="/" class="active">Config</a>
      <a href="/form">Form</a>
      <a href="/logs-view">Logs</a>
    </div>
  </nav>

  <div class="card">
    <h2>Drone Config</h2>
    
    <div id="status-message" class="loading">กำลังโหลดข้อมูล...</div>

    <div id="config-content" style="display: none;">
      <div class="item">
        <span class="label">Drone ID:</span>
        <span class="value" id="val-drone-id">-</span>
      </div>
      <div class="item">
        <span class="label">Drone Name:</span>
        <span class="value" id="val-drone-name">-</span>
      </div>
      <div class="item">
        <span class="label">Light:</span>
        <span class="value" id="val-light">-</span>
      </div>
      <div class="item">
        <span class="label">Country:</span>
        <span class="value" id="val-country">-</span>
      </div>
    </div>
  </div>

</body>
</html>
